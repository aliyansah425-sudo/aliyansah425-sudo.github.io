async function loadSurah(n){try{const d=(await(await fetch('https://equran.id/api/v2/surat/'+n)).json()).data;AY=d.ayat;$('st').textContent=d.namaLatin;$('ayat').innerHTML=`<button class="btn" onclick="playA(0)">▶ Putar dari awal</button>`+d.ayat.map((a,i)=>`<div class="ay"><div class="ar">${a.teksArab} ﴿${a.nomorAyat}﴾</div><div class="lat">${a.teksLatin}</div><div class="mut" style="font-size:14px">${a.teksIndonesia}</div><button class="btn" onclick="playA(${i})">▶ ${a.nomorAyat}</button></div>`).join('')}catch(e){$('ayat').innerHTML='<div class="msg">Gagal memuat (belum tersimpan offline).</div>'}}
function playA(i){const a=AY[i],u=a&&a.audio&&(a.audio['05']||Object.values(a.audio)[0]);if(!u)return;au.src=u;au.play();au.onended=()=>playA(i+1)}
async function dl(){let ok=0;for(let n=1;n<=114;n++){try{await fetch('https://equran.id/api/v2/surat/'+n);ok++}catch(e){}$('dls').textContent=ok+' / 114 tersimpan'}}
V.quran=(f=>()=>{setTimeout(listS,0);return f()})(V.quran);V.surah=(f=>n=>{au.pause();setTimeout(()=>loadSurah(n),0);return f(n)})(V.surah);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
addEventListener('scroll',()=>{const m=$('mini');if(m)m.classList.toggle('show',scrollY>230)},{passive:true});
init();
</script></body></html>
